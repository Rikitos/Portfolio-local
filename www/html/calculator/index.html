<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calc">
  <div class="calc__wrapper">
    <div class="calc__display">
      <div class="calc__display__expression" id="expression"></div>
      <div class="calc__display__value" id="display">0</div>
    </div>
    <div class="calc__buttons">
      <button class="calc__btn calc__btn--clear" data-action="clear">AC</button>
      <button class="calc__btn calc__btn--operator" data-action="sign">+/-</button>
      <button class="calc__btn calc__btn--operator" data-action="percent">%</button>
      <button class="calc__btn calc__btn--operator" data-action="operator" data-value="/">÷</button>

      <button class="calc__btn" data-action="digit" data-value="7">7</button>
      <button class="calc__btn" data-action="digit" data-value="8">8</button>
      <button class="calc__btn" data-action="digit" data-value="9">9</button>
      <button class="calc__btn calc__btn--operator" data-action="operator" data-value="*">×</button>

      <button class="calc__btn" data-action="digit" data-value="4">4</button>
      <button class="calc__btn" data-action="digit" data-value="5">5</button>
      <button class="calc__btn" data-action="digit" data-value="6">6</button>
      <button class="calc__btn calc__btn--operator" data-action="operator" data-value="-">−</button>

      <button class="calc__btn" data-action="digit" data-value="1">1</button>
      <button class="calc__btn" data-action="digit" data-value="2">2</button>
      <button class="calc__btn" data-action="digit" data-value="3">3</button>
      <button class="calc__btn calc__btn--operator" data-action="operator" data-value="+">+</button>

      <button class="calc__btn calc__btn--span2" data-action="digit" data-value="0">0</button>
      <button class="calc__btn" data-action="decimal">.</button>
      <button class="calc__btn calc__btn--equals" data-action="equals">=</button>
    </div>
  </div>
</div>

<script src="/assets/js/header.js"></script>
<script src="calculator.js"></script>
</body>
</html>
