<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Generator</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cat-gen">
  <h1 class="cat-gen__title">Cat Meme Generator</h1>
  <p class="cat-gen__description">Click the button for a random cat</p>
  <div class="cat-gen__img-wrapper">
    <img
      class="cat-gen__img cat-gen__img--show"
      src="cats/cat1.jpg"
      data-url="cats"
      alt="Random cat"
    >
  </div>
  <button class="cat-gen__btn">Next Cat</button>
</div>

<script src="/assets/js/header.js"></script>
<script src="cat-generator.js"></script>
</body>
</html>
