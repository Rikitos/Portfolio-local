<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ttt">
  <h1 class="ttt__title">Tic Tac Toe</h1>
  <p class="ttt__status" id="status"></p>
  <div class="ttt__board" id="board">
    <button class="ttt__cell" data-index="0"></button>
    <button class="ttt__cell" data-index="1"></button>
    <button class="ttt__cell" data-index="2"></button>
    <button class="ttt__cell" data-index="3"></button>
    <button class="ttt__cell" data-index="4"></button>
    <button class="ttt__cell" data-index="5"></button>
    <button class="ttt__cell" data-index="6"></button>
    <button class="ttt__cell" data-index="7"></button>
    <button class="ttt__cell" data-index="8"></button>
  </div>
  <button class="ttt__btn" id="restart">Restart</button>
</div>

<script src="/assets/js/header.js"></script>
<script src="game.js"></script>
</body>
</html>
