<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <title>KP Monogram Logo</title>
  <desc>KP monogram circle logo — navy background, gold ring and K, silver P, Palatino serif</desc>

  <circle cx="200" cy="200" r="130" fill="none" stroke="#C9A84C" stroke-width="6"/>
  <text x="200" y="240" text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif"
        font-size="96" font-weight="400" letter-spacing="16">
    <tspan fill="#C9A84C">K</tspan><tspan fill="#A8B8C8">P</tspan>
  </text>
</svg>
